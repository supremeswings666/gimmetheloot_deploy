services:
  app:
    build:
      context: ../gimmetheloot
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ../gimmetheloot/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ../gimmetheloot/public:/app/public
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
